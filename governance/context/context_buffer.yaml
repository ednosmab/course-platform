  - "2026-06-24: BUG-FIX-TEXT-BLOCK — Texto cortado ao sair de foco no bloco de texto do editor. Causa: overflow:hidden no container + falta de onInput para auto-resize durante digitação. Correcção: (1) adicionado onInput handler para chamar measureAndResize, (2) removida condição blockHeight que impedia actualizações em blocos novos, (3) actualização de altura propagada para desktop+tablet+mobile. Ficheiro: apps/admin/src/components/editor/EditorCanvas.tsx"
  - "2026-06-24: FEATURE-AUTO-SCROLL-DRAG — Auto-scroll durante drag-and-drop no editor. Causa: inexistência de lógica de scroll automático ao arrastar blocos para bordas. Correcção: (1) scrollContainerRef no container scrollável desktop, (2) requestAnimationFrame loop com threshold 50px e velocidade proporcional 2-12px/frame, (3) auto-scroll no useViewportInteraction para tablet/mobile. Ficheiros: EditorCanvas.tsx, useViewportInteraction.ts"
  - "PENDENTE-DRAG-CANVAS-EXPAND: Canvas não acompanha arrasto do elemento pra baixo — pageH só é recalculado no React render, mas durante drag não há re-renders (refs+DOM direct). Solução: expandir pageRootRef via DOM direct (el.style.minHeight) durante tick() do auto-scroll, proporcionalmente à posição Y do bloco arrastado"
  - "2026-06-25: BUG-FIX-MIDDLEWARE-AUTH — fetch failed no Edge Runtime ao chamar supabase.auth.getUser() sem try/catch. Causa: Edge Runtime sandbox tem restrições de fetch (DNS, timeout, isolation) que impedem context.fetch de aceder ao Supabase. Correcção: wrap getUser() em try/catch, user=null em caso de falha (redirect para /login em rotas protegidas). Ficheiro: apps/admin/src/middleware.ts. Lint: 0 errors."
  - "2026-06-25: BUG-FIX-I18N-BARREL — createContext is not a function no build. Causa: @projeto/core barrel exportava i18n (react-i18next) que puxa createContext do react; no server build do Next.js 16 react resolve para react-server (sem createContext). Correcção: (1) removido export * from './i18n' de packages/core/src/index.ts, (2) adicionado exports field em packages/core/package.json, (3) admin i18n-provider.tsx importa directamente de @projeto/core/i18n. Build: admin + student OK."

