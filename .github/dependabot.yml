version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    assignees: []
    labels:
      - 'dependencies'
    ignore:
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'expo*'
    groups:
      tamagui:
        patterns:
          - '@tamagui/*'
          - 'tamagui'
      supabase:
        patterns:
          - '@supabase/*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
