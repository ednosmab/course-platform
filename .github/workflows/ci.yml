name: CI

on:
  push:
    branches: [main, feat/dsv2-reform]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — student (expo web) + admin (next build)
        run: pnpm run build:verify

      - name: Check React consistency across workspace
        run: pnpm run test:react-consistency

      - name: Verify UI governance rules
        run: pnpm run verify:ui

      - name: Build Ladle stories
        run: pnpm --filter @projeto/ui ladle:build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E + Visual Regression tests
        run: pnpm run test:e2e

      - name: Upload Playwright report (E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

      - name: Run Ladle VRT (component-level visual regression)
        run: pnpm run test:vrt:ladle

      - name: Upload Playwright report (Ladle VRT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ladle-vrt
          path: |
            tests/ladle-vrt/test-results/
            test-results-ladle/
          retention-days: 7
